<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Web DMX Controller</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 40px; }
        .container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 20px; }
        button:hover { background: #0056b3; }
        .slider-group { margin: 20px 0; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type=range] { width: 100%; height: 8px; border-radius: 5px; outline: none; }
        #red { accent-color: red; }
        #green { accent-color: green; }
        #blue { accent-color: blue; }
        #status { color: #888; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Web DMX Controller</h2>
    <p>Control your LED light over USB for free.</p>
    
    <button id="connectBtn">🔌 Connect USB Light</button>
    <div id="status">Status: Disconnected</div>

    <div class="slider-group">
        <label>Red Channel</label>
        <input type="range" id="red" min="0" max="255" value="0" disabled>
    </div>

    <div class="slider-group">
        <label>Green Channel</label>
        <input type="range" id="green" min="0" max="255" value="0" disabled>
    </div>

    <div class="slider-group">
        <label>Blue Channel</label>
        <input type="range" id="blue" min="0" max="255" value="0" disabled>
    </div>
</div>

<script>
    let port;
    let writer;
    const dmxBuffer = new Uint8Array(513); // 1 start byte + 512 DMX channels

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const sliders = [document.getElementById('red'), document.getElementById('green'), document.getElementById('blue')];

    connectBtn.addEventListener('click', async () => {
        if (!navigator.serial) {
            alert("Your browser doesn't support Web Serial. Please use Google Chrome or Microsoft Edge!");
            return;
        }
        try {
            statusDiv.innerText = "Selecting device...";
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 250000, dataBits: 8, stopBits: 2, parity: "none" }); // Standard DMX serial timing
            writer = port.writable.getWriter();
            
            statusDiv.innerText = "🟢 Connected!";
            statusDiv.style.color = "lightgreen";
            sliders.forEach(slider => slider.disabled = false);
            
            // Continuous frame loop to keep light responsive
            sendDMX();
        } catch (err) {
            statusDiv.innerText = "❌ Connection Failed";
            statusDiv.style.color = "red";
            console.error(err);
        }
    });

    sliders.forEach((slider, index) => {
        slider.addEventListener('input', () => {
            // Map Red to channel 1, Green to channel 2, Blue to channel 3
            dmxBuffer[index + 1] = slider.value; 
        });
    });

    async function sendDMX() {
        if (!writer) return;
        try {
            // Write DMX packet frame
            await writer.write(dmxBuffer);
            setTimeout(sendDMX, 30); // ~33 frames per second
        } catch (err) {
            console.error("Write error:", err);
        }
    }
</script>

</body>
</html>
